name: Dispatch Missing Builds

# Fans out one Build run per version. Does not build itself.
#
# Empty `versions`:
#   - recreate=false → only tags not yet released here (true "missing")
#   - recreate=true  → every supported upstream version (≥ MIN_GETTEXT_VERSION)
#                      so rebuild/re-publish works when nothing is "missing"
#
# Version selection/sorting is create_releases (Python + packaging).

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated versions (empty = missing only, or all supported if recreate)'
        required: false
        type: string
      publish:
        description: 'Pass publish=true to each Build run (create GitHub Releases)'
        required: false
        type: boolean
        default: false
      recreate:
        description: 'Rebuild path: empty versions → all supported; also delete+recreate release on publish'
        required: false
        type: boolean
        default: false
      max:
        description: 'Cap how many versions to dispatch (0 = no cap). Newest N when set (e.g. 3).'
        required: false
        type: string
        default: "0"

concurrency:
  group: dispatch-missing-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # gh workflow run

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise tools (uv)
        uses: jdx/mise-action@v2

      - name: Plan and dispatch Build runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_VERSIONS: ${{ inputs.versions }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_RECREATE: ${{ inputs.recreate }}
          INPUT_MAX: ${{ inputs.max }}
        run: |
          set -euo pipefail
          publish=false
          recreate=false
          case "${INPUT_PUBLISH:-false}" in true|1|yes|True) publish=true ;; esac
          case "${INPUT_RECREATE:-false}" in true|1|yes|True) recreate=true ;; esac
          max_n="${INPUT_MAX:-0}"
          max_n="${max_n// /}"
          [[ -n "$max_n" ]] || max_n=0

          # packaging-sorted list from create_releases (oldest → newest).
          # recreate + empty versions → all supported (not just missing).
          mapfile -t versions < <(
            if [[ -n "${INPUT_VERSIONS// }" ]]; then
              # shellcheck disable=SC2086
              ./create_releases --list-to-build ${INPUT_VERSIONS}
            elif [[ "$recreate" == true ]]; then
              ./create_releases --list-to-build --all
            else
              ./create_releases --list-to-build
            fi
          )

          if [[ "$max_n" =~ ^[0-9]+$ ]] && [[ "$max_n" -gt 0 ]]; then
            if (( ${#versions[@]} > max_n )); then
              versions=("${versions[@]: -max_n}")
            fi
          fi

          {
            echo "## Dispatch plan"
            echo ""
            echo "- Count: **${#versions[@]}**"
            echo "- Publish each: **${publish}**"
            echo "- Recreate each: **${recreate}**"
            echo "- Max cap: \`${max_n:-none}\`"
            echo ""
            if ((${#versions[@]} == 0)); then
              echo "Nothing to dispatch."
            else
              for v in "${versions[@]}"; do
                echo "- \`${v}\`"
              done
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if ((${#versions[@]} == 0)); then
            echo "No versions to dispatch"
            exit 0
          fi

          echo "Dispatching ${#versions[@]} Build run(s), publish=${publish}, recreate=${recreate}"
          failed=()
          i=0
          for version in "${versions[@]}"; do
            cmd=(gh workflow run build.yml
              --ref "${GITHUB_REF_NAME:-main}"
              -f "version=${version}"
              -f "publish=${publish}"
              -f "recreate=${recreate}"
            )
            echo "+ ${cmd[*]}"
            if ! "${cmd[@]}"; then
              echo "FAILED to dispatch ${version}"
              failed+=("$version")
            fi
            i=$((i + 1))
            if (( i < ${#versions[@]} )); then
              sleep 1.5
            fi
          done

          if ((${#failed[@]} > 0)); then
            echo "Dispatch failures: ${failed[*]}"
            exit 1
          fi
          echo "✓ All Build runs dispatched"
