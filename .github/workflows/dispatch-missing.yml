name: Dispatch Missing Builds

# Finds versions not yet released on this repo and dispatches Build once per
# version. Each Build run is isolated (own matrix, own artifacts, own optional
# release) so one failure never cancels the others.
#
# Does not build itself — only fans out to build.yml.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space-separated versions (empty = auto-detect missing vs this repo releases)'
        required: false
        type: string
      publish:
        description: 'Pass publish=true to each Build run (create GitHub Releases)'
        required: false
        type: boolean
        default: false
      recreate:
        description: 'If publish: delete existing release then create (pass recreate to Build)'
        required: false
        type: boolean
        default: false
      max:
        description: 'Cap how many versions to dispatch (0 = no cap). Use for smoke (e.g. 3).'
        required: false
        type: string
        default: "0"

concurrency:
  group: dispatch-missing-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # gh workflow run

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Plan and dispatch Build runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_VERSIONS: ${{ inputs.versions }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_RECREATE: ${{ inputs.recreate }}
          INPUT_MAX: ${{ inputs.max }}
        run: |
          python3 <<'PY'
          import json, os, subprocess, importlib.machinery, importlib.util, time
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          raw = (os.environ.get("INPUT_VERSIONS") or "").strip()
          publish = (os.environ.get("INPUT_PUBLISH") or "false").lower() in (
              "true", "1", "yes",
          )
          recreate = (os.environ.get("INPUT_RECREATE") or "false").lower() in (
              "true", "1", "yes",
          )
          try:
              max_n = int((os.environ.get("INPUT_MAX") or "0").strip() or "0")
          except ValueError:
              max_n = 0

          if raw:
              versions = raw.split()
          else:
              path = Path("create_releases").resolve()
              loader = importlib.machinery.SourceFileLoader("create_releases", str(path))
              spec = importlib.util.spec_from_loader(loader.name, loader)
              assert spec is not None and spec.loader is not None
              mod = importlib.util.module_from_spec(spec)
              loader.exec_module(mod)
              versions = mod.versions_to_build([])

          if max_n > 0:
              # Prefer newest-looking tags last alphabetically is wrong for 3.x vs 5.x;
              # sort then take from the end (higher versions often sort later for 5.x).
              versions = versions[-max_n:] if len(versions) > max_n else versions

          lines = [
              "## Dispatch plan\n",
              f"- Count: **{len(versions)}**\n",
              f"- Publish each: **{publish}**\n",
              f"- Recreate each: **{recreate}**\n",
              f"- Max cap: `{max_n or 'none'}`\n\n",
          ]
          if not versions:
              lines.append("Nothing to dispatch.\n")
              summary.write_text("".join(lines), encoding="utf-8")
              print("No versions to dispatch")
              raise SystemExit(0)

          for v in versions:
              lines.append(f"- `{v}`\n")
          summary.write_text("".join(lines), encoding="utf-8")

          print(f"Dispatching {len(versions)} Build run(s), publish={publish}, recreate={recreate}")
          failed = []
          for i, version in enumerate(versions):
              cmd = [
                  "gh", "workflow", "run", "build.yml",
                  "--ref", os.environ.get("GITHUB_REF_NAME") or "main",
                  "-f", f"version={version}",
                  "-f", f"publish={'true' if publish else 'false'}",
                  "-f", f"recreate={'true' if recreate else 'false'}",
              ]
              print("+", " ".join(cmd), flush=True)
              proc = subprocess.run(cmd, check=False)
              if proc.returncode != 0:
                  print(f"FAILED to dispatch {version}", flush=True)
                  failed.append(version)
              # Small pause so Actions is not slammed with N simultaneous creates
              if i + 1 < len(versions):
                  time.sleep(1.5)

          if failed:
              print("Dispatch failures:", failed, flush=True)
              raise SystemExit(1)
          print("✓ All Build runs dispatched", flush=True)
          PY
